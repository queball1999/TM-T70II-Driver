; tmt70print defaults -- the equivalent of "lpadmin -p TM-T70II -o ..." on Linux.
;
; Searched in order:
;   %APPDATA%\tmt70print\tmt70print.ini
;   next to tmt70print.exe / tmt70print.py
; Override any of it on the command line; see  tmt70print --help
; Check what is actually in effect with  tmt70print --show-config
;
; SPDX-License-Identifier: GPL-2.0-or-later

[defaults]

; --- destination --------------------------------------------------------- ;
; tmt70://04b8:0202          WinUSB (needs the WinUSB driver bound; see docs)
; tmt70://04b8:0202/SERIAL   a specific unit
; socket://10.0.0.50:9100    Ethernet (UB-E04 or a serial-to-Ethernet adaptor)
; printer://TM-T70II         a Windows queue using a pass-through driver
device = tmt70://04b8:0202

; --- media --------------------------------------------------------------- ;
; X80mm (default) | X80mmLong | X58mm
media = X80mm

; --- print quality ------------------------------------------------------- ;
; density: light | normal | dark
density = normal
; speed: auto | 1 | 2 | 3 | 4
speed = auto

; --- paper handling ------------------------------------------------------ ;
; cut: partial | full | none
cut = partial
; millimetres of blank feed before the blade
feed = 3
; left margin in millimetres
margin = 0
; blank-space reduction: off | topbottom | all
reduce = topbottom
rotate180 = false

; --- text ---------------------------------------------------------------- ;
; 0 = PC437, 2 = PC850, 16 = Windows-1252, 19 = PC858
codepage = 0
; left | center | right
align = left
; characters per line; leave unset to derive from `media` (80 mm = 42, 58 mm = 30)
; cols = 42
encoding = utf-8
tabstop = 4
wrap = true

; --- images -------------------------------------------------------------- ;
; Floyd-Steinberg dithering; set false for a plain threshold
dither = true
; threshold for undithered output, 0-255
threshold = 128
invert = false
; scale oversized images down to the paper width
scale = true
